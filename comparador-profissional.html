<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparador profissional | QuantoLab</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><div class="shell nav"><a class="brand" href="/"><span class="mark">QL</span>QuantoLab</a></div></header><main><section class="calc-hero"><div class="shell"><h1>Comparador profissional</h1><p class="lead">Compare dois formatos usando suas próprias premissas.</p></div></section><div class="shell"><section class="calc-grid"><div class="panel form"><div class="field"><label>Valor mensal A</label><div class="input-wrap"><input id="a" type="number" value="7000"></div></div><div class="field"><label>Adicional mensal A</label><div class="input-wrap"><input id="b" type="number" value="1200"></div></div><div class="field"><label>Adicional anual A</label><div class="input-wrap"><input id="c" type="number" value="0"></div></div><div class="grid2"><div class="field"><label>Extra A1</label><div class="input-wrap"><select id="d"><option value="1">Sim</option><option value="0">Não</option></select></div></div><div class="field"><label>Extra A2</label><div class="input-wrap"><select id="e"><option value="1">Sim</option><option value="0">Não</option></select></div></div></div><div class="field"><label>Valor mensal B</label><div class="input-wrap"><input id="f" type="number" value="10000"></div></div><div class="grid2"><div class="field"><label>Períodos anuais B</label><div class="input-wrap"><input id="g" type="number" value="11"></div></div><div class="field"><label>Percentual B</label><div class="input-wrap"><input id="h" type="number" value="10"></div></div></div><div class="field"><label>Custos mensais B</label><div class="input-wrap"><input id="i" type="number" value="500"></div></div><button id="calcular" class="btn">Comparar →</button></div><aside class="panel result"><div class="result-top"><div class="result-kicker">Resultado</div><div id="winner" class="result-value">—</div></div><div class="result-body"><div class="row"><span>A anual</span><strong id="r1">0</strong></div><div class="row"><span>B anual</span><strong id="r2">0</strong></div><div class="row"><span>Diferença</span><strong id="r3">0</strong></div><div class="highlight"><span>B mensal para empatar</span><strong id="r4">0</strong></div></div></aside></section></div></main><script src="/clt-pj.js"></script></body></html>
