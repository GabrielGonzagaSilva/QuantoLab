name: Apply logo responsive

on:
  push:
    branches: [branding-logo-responsive]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply shared responsive logo styles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          logo = Path('quantolab-logo.svg')
          if not logo.exists():
              raise SystemExit('quantolab-logo.svg ausente')

          p = Path('style.css')
          css = p.read_text()
          old = '''.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-size:17px;font-weight:720;letter-spacing:0;white-space:nowrap}\n.mark{width:31px;height:31px;flex:0 0 31px;display:grid;place-items:center;border-radius:9px;background:var(--dark);color:var(--accent);font-size:10px;font-weight:800}'''
          new = '''.brand{display:block;width:clamp(158px,22vw,196px);max-width:58vw;aspect-ratio:333/51;flex:0 1 auto;background:url('/quantolab-logo.svg') left center/contain no-repeat;font-size:0;line-height:0;white-space:nowrap}\n.mark{display:none}'''

          if old not in css:
              raise SystemExit('Bloco original da marca não encontrado; alteração abortada.')
          css = css.replace(old, new, 1)
          p.write_text(css)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-logo-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/apply-logo-temp.yml
          git commit -m "Apply responsive QuantoLab logo"
          git push origin HEAD:branding-logo-responsive
