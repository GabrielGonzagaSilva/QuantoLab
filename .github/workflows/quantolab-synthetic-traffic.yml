name: QuantoLab Synthetic Traffic — manual only

on:
  workflow_dispatch:
    inputs:
      visits:
        description: Number of synthetic visits
        required: true
        default: '25'
      window_seconds:
        description: Distribution window in seconds
        required: true
        default: '900'

permissions:
  contents: read

concurrency:
  group: quantolab-synthetic-traffic
  cancel-in-progress: false

jobs:
  synthetic-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
      BR_PROXIES_B64: ${{ secrets.BR_PROXIES_B64 }}
      BR_PROXIES_FILE: /tmp/quantolab-br-proxies.csv
      TRAFFIC_STATE_DIR: .traffic_state
      TRAFFIC_LOG_DIR: traffic-logs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tools/traffic-requirements.txt

      - name: Validate and decode Brazilian proxy pool
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BR_PROXIES_B64:-}" ]; then
            echo "BR_PROXIES_B64 is required for a manual synthetic run." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$BR_PROXIES_B64" | base64 --decode > "$BR_PROXIES_FILE"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/traffic-requirements.txt
          python -m playwright install chromium

      - name: Run explicitly requested synthetic accesses
        run: |
          python tools/quantolab_synthetic_traffic.py \
            --visits "${{ inputs.visits }}" \
            --window-seconds "${{ inputs.window_seconds }}" \
            --daily-target "${{ inputs.visits }}"

      - name: Upload synthetic traffic log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quantolab-synthetic-${{ github.run_id }}
          path: traffic-logs/
          if-no-files-found: ignore
          retention-days: 14
