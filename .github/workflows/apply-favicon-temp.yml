name: Apply favicon

on:
  push:
    branches: [add-favicon]
    paths: [.github/workflows/apply-favicon-temp.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: add-favicon
          persist-credentials: true
          fetch-depth: 1

      - name: Apply favicon to all pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          icon = '<link rel="icon" href="/favicon.svg" type="image/svg+xml">'
          changed = 0
          for path in sorted(Path('.').glob('*.html')):
              html = path.read_text()
              if 'rel="icon"' in html or "rel='icon'" in html:
                  continue
              marker = '<link rel="stylesheet" href="/style.css">'
              if marker not in html:
                  raise SystemExit(f'{path}: stylesheet marker not found')
              html = html.replace(marker, icon + '\n' + marker, 1)
              path.write_text(html)
              changed += 1

          if changed == 0:
              raise SystemExit('No HTML page was updated')
          if not Path('favicon.svg').exists():
              raise SystemExit('favicon.svg missing')

          for path in sorted(Path('.').glob('*.html')):
              html = path.read_text()
              if icon not in html:
                  raise SystemExit(f'{path}: favicon link missing')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-favicon-temp.yml
          git config user.name "Gabriel G. Silva"
          git config user.email "151961393+GabrielGonzagaSilva@users.noreply.github.com"
          git add '*.html' favicon.svg .github/workflows/apply-favicon-temp.yml
          git commit -m "Apply QuantoLab favicon across pages"
          git push origin HEAD:add-favicon
