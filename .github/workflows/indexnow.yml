name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'favicon.svg'
      - 'quantolab-logo.svg'
      - '54b967966f714fbb3be34ca2b1113ef2.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout release content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Wait for exact production release
        env:
          SITE: https://quantolab.com.br
        shell: bash
        run: |
          set -euo pipefail

          expected_sitemap_sha="$(sha256sum sitemap.xml | awk '{print $1}')"
          ready=0

          for attempt in $(seq 1 60); do
            cache_bust="${GITHUB_SHA}-${attempt}"
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$SITE/sitemap.xml?v=$cache_bust" -o /tmp/production-sitemap.xml; then
              production_sitemap_sha="$(sha256sum /tmp/production-sitemap.xml | awk '{print $1}')"
            else
              production_sitemap_sha=""
            fi

            home="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$SITE/?v=$cache_bust" 2>/dev/null || true)"
            guides="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$SITE/guias?v=$cache_bust" 2>/dev/null || true)"
            editorial="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$SITE/politica-editorial?v=$cache_bust" 2>/dev/null || true)"
            salary="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$SITE/salario-liquido?v=$cache_bust" 2>/dev/null || true)"

            if [ "$production_sitemap_sha" = "$expected_sitemap_sha" ] \
              && grep -q 'href="/guias"' <<<"$home" \
              && grep -q 'Guias QuantoLab' <<<"$guides" \
              && grep -q '<h1>Política editorial</h1>' <<<"$editorial" \
              && grep -q 'data-editorial-depth="salario-liquido"' <<<"$salary" \
              && ! grep -q 'data-ad-slot' <<<"$home$guides$editorial$salary" \
              && ! grep -q 'Espaço publicitário' <<<"$home$guides$editorial$salary"; then
              ready=1
              break
            fi

            echo "Production not synchronized yet: attempt $attempt/60"
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "Production did not match the expected release within the validation window."
            exit 1
          fi

          echo "Production release verified against repository sitemap and critical AdSense readiness markers."

      - name: Validate publisher association
        env:
          SITE: https://quantolab.com.br
          INDEXNOW_KEY: 54b967966f714fbb3be34ca2b1113ef2
        shell: bash
        run: |
          set -euo pipefail

          key_body="$(curl -fsSL --max-time 15 "$SITE/$INDEXNOW_KEY.txt")"
          [ "$key_body" = "$INDEXNOW_KEY" ]

          ads_body="$(curl -fsSL --max-time 15 "$SITE/ads.txt")"
          grep -Fxq 'google.com, pub-9919728006820087, DIRECT, f08c47fec0942fa0' <<<"$ads_body"

          echo "IndexNow key and Google AdSense ads.txt association verified in production."

      - name: Submit synchronized sitemap URLs
        env:
          INDEXNOW_KEY: 54b967966f714fbb3be34ca2b1113ef2
          SITE: https://quantolab.com.br
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$SITE/sitemap.xml?v=$GITHUB_SHA" -o /tmp/sitemap.xml
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          key = os.environ['INDEXNOW_KEY']
          site = os.environ['SITE']
          root = ET.parse('/tmp/sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns) if node.text]
          if not urls:
              raise SystemExit('No URLs found in sitemap.xml')
          if len(urls) > 10000:
              raise SystemExit('IndexNow payload exceeds 10,000 URLs')
          payload = {
              'host': 'quantolab.com.br',
              'key': key,
              'keyLocation': f'{site}/{key}.txt',
              'urlList': urls,
          }
          with open('/tmp/indexnow.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False)
          print(f'Prepared {len(urls)} synchronized URL(s) for IndexNow.')
          PY

          status="$(curl -sS --max-time 30 -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json)"

          cat /tmp/indexnow-response.txt || true
          echo "IndexNow HTTP status: $status"
          case "$status" in
            200|202) ;;
            *) exit 1 ;;
          esac
