name: QuantoLab Synthetic Monitoring

on:
  schedule:
    - cron: '7 * * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:
    inputs:
      force_visits:
        description: 'Optional number of visits for a manual validation run'
        required: false
        default: '1'

permissions:
  contents: read
  actions: write

concurrency:
  group: quantolab-synthetic-monitoring
  cancel-in-progress: false

jobs:
  synthetic-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      BR_PROXIES_B64: ${{ secrets.BR_PROXIES_B64 }}
      BR_PROXIES_FILE: /tmp/quantolab-br-proxies.csv
      TRAFFIC_STATE_DIR: .traffic_state
      TRAFFIC_LOG_DIR: traffic-logs
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate proxy secret
        id: proxy-secret
        shell: bash
        run: |
          if [ -z "$BR_PROXIES_B64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BR_PROXIES_B64 is not configured. Synthetic traffic is paused safely."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.proxy-secret.outputs.configured == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tools/traffic-requirements.txt

      - name: Restore synthetic traffic state
        if: steps.proxy-secret.outputs.configured == 'true'
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .traffic_state
          key: quantolab-traffic-state-${{ github.run_id }}
          restore-keys: |
            quantolab-traffic-state-

      - name: Decode Brazilian proxy pool
        if: steps.proxy-secret.outputs.configured == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$BR_PROXIES_B64" | base64 --decode > "$BR_PROXIES_FILE"
          python - <<'PY'
          import csv, os
          path = os.environ['BR_PROXIES_FILE']
          with open(path, encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          if not rows or not {'id', 'server'}.issubset(rows[0].keys()):
              raise SystemExit('Invalid BR proxy CSV: expected id,server columns')
          print(f'Brazil proxy endpoints loaded: {len(rows)}')
          PY

      - name: Install Playwright
        if: steps.proxy-secret.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/traffic-requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute randomized monitoring window
        if: steps.proxy-secret.outputs.configured == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/quantolab_ci_traffic.py --force-visits "${{ inputs.force_visits }}" --window-seconds 600
          else
            python tools/quantolab_ci_traffic.py --window-seconds 2880
          fi

      - name: Save synthetic traffic state
        if: always() && steps.proxy-secret.outputs.configured == 'true'
        uses: actions/cache/save@v4
        with:
          path: .traffic_state
          key: quantolab-traffic-state-${{ github.run_id }}

      - name: Upload run log
        if: always() && steps.proxy-secret.outputs.configured == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: quantolab-traffic-${{ github.run_id }}
          path: traffic-logs/
          if-no-files-found: ignore
          retention-days: 14
