name: Fix CodeQL launch check

on:
  push:
    branches: [launch-seo-indexnow]
    paths:
      - '.github/workflows/fix-codeql-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Replace substring check with exact sitemap entry check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa.mjs')
          s = p.read_text(encoding='utf-8')
          old = "if(sitemap.includes('https://quantolab.com.br/contato'))fail('sitemap.xml: contato noindex não deve constar no sitemap.');"
          new = "if(/<loc>https:\\/\\/quantolab\\.com\\.br\\/contato<\\/loc>/.test(sitemap))fail('sitemap.xml: contato noindex não deve constar no sitemap.');"
          if old not in s:
              raise SystemExit('Target QA line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "Gabriel G. Silva"
          git config user.email "151961393+GabrielGonzagaSilva@users.noreply.github.com"
          git add scripts/qa.mjs
          git commit -m "Fix exact sitemap noindex validation"
          git push
