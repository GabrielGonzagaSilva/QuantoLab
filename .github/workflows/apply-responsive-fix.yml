name: Apply responsive breakpoint fix

on:
  push:
    branches: [responsive-final-audit-aug15]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: responsive-final-audit-aug15

      - name: Apply breakpoint fix
        run: node scripts/fix-responsive-breakpoint.mjs

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Align narrow responsive breakpoint with QA"
          git push origin HEAD:responsive-final-audit-aug15
