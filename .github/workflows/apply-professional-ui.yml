name: Apply professional UI

on:
  push:
    branches:
      - professional-ui-system-aug14

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply professional UI
        run: node scripts/apply-professional-ui.mjs

      - name: Commit transformed files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No transformation changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' style.css
          git commit -m "Apply professional UI system"
          git push
