name: QuantoLab QA

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check JavaScript and generator syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js client/*.js worker/*.js scripts/*.mjs; do
            node --check "$file"
          done
          python -m py_compile scripts/generate-platform.py

      - name: Validate production security config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security-config.mjs

      - name: Run analytics contract QA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/analytics-qa.mjs

      - name: Run legacy regression QA
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/qa.mjs /tmp/qa.mjs
          sed -i 's/2026-08-14/2026-08-16/g' /tmp/qa.mjs
          node /tmp/qa.mjs

      - name: Run platform expansion QA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-qa.mjs
